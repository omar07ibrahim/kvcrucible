<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-labelledby="title description">
  <title id="title">KVCrucible local reproduction workflow</title>
  <desc id="description">Four local steps inspect the contract, execute folds and fault scenarios, then regenerate checked visual evidence. Fresh quality gates show the pinned toolchain, tests, and static release target.</desc>
  <g><rect x="0" y="0" width="1440" height="910" rx="0" fill="#07111f"/><text x="60" y="66" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">Local reproduction workflow</text><text x="60" y="101" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Evidence run: CPU-only · no model download · no runtime service</text><rect x="1198" y="48" width="182" height="34" rx="17" fill="#111f34" stroke="#5eead4"/><text x="1289" y="71" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">LOCAL EVIDENCE</text><rect x="50" y="150" width="650" height="220" rx="20" fill="#0f1b2d" stroke="#334155"/><circle cx="98" cy="197" r="25" fill="#5eead4"/><text x="98" y="203" fill="#07111f" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" text-anchor="middle">01</text><text x="138" y="204" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Inspect the current boundary</text><rect x="80" y="238" width="590" height="102" rx="12" fill="#111f34"/><text x="100" y="275" fill="#5eead4" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="14" font-weight="400" text-anchor="start">$ cargo run -- contract</text><text x="100" y="311" fill="#5eead4" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="14" font-weight="400" text-anchor="start">$ cargo run -- contract --format json</text><rect x="740" y="150" width="650" height="220" rx="20" fill="#0f1b2d" stroke="#334155"/><circle cx="788" cy="197" r="25" fill="#a78bfa"/><text x="788" y="203" fill="#07111f" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" text-anchor="middle">02</text><text x="828" y="204" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Execute the delivered fold</text><rect x="770" y="238" width="590" height="102" rx="12" fill="#111f34"/><text x="790" y="275" fill="#a78bfa" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="14" font-weight="400" text-anchor="start">$ cargo run --example delivered_fold</text><rect x="50" y="410" width="650" height="220" rx="20" fill="#0f1b2d" stroke="#334155"/><circle cx="98" cy="457" r="25" fill="#34d399"/><text x="98" y="463" fill="#07111f" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" text-anchor="middle">03</text><text x="138" y="464" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Materialize and compare faults</text><rect x="80" y="498" width="590" height="102" rx="12" fill="#111f34"/><text x="100" y="535" fill="#34d399" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="14" font-weight="400" text-anchor="start">$ cargo run --example fault_materialization</text><text x="100" y="571" fill="#34d399" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="14" font-weight="400" text-anchor="start">$ cargo run --example verdict_matrix</text><rect x="740" y="410" width="650" height="220" rx="20" fill="#0f1b2d" stroke="#334155"/><circle cx="788" cy="457" r="25" fill="#fbbf24"/><text x="788" y="463" fill="#07111f" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="900" text-anchor="middle">04</text><text x="828" y="464" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start">Regenerate and verify evidence</text><rect x="770" y="498" width="590" height="102" rx="12" fill="#111f34"/><text x="790" y="535" fill="#fbbf24" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="14" font-weight="400" text-anchor="start">$ python3 tools/render_readme_visuals.py</text><text x="790" y="571" fill="#fbbf24" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="14" font-weight="400" text-anchor="start">$ python3 tools/render_readme_visuals.py --check</text><text x="60" y="686" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start">FRESHLY EXECUTED GATES</text><rect x="50" y="710" width="310" height="112" rx="16" fill="#0f1b2d" stroke="#334155"/><text x="72" y="744" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start">TOOLCHAIN</text><text x="72" y="785" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Rust 1.97.0</text><rect x="390" y="710" width="310" height="112" rx="16" fill="#0f1b2d" stroke="#334155"/><text x="412" y="744" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start">STATIC ANALYSIS</text><text x="412" y="785" fill="#a78bfa" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">fmt + Clippy pass</text><rect x="730" y="710" width="310" height="112" rx="16" fill="#0f1b2d" stroke="#334155"/><text x="752" y="744" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start">TEST CORPUS</text><text x="752" y="785" fill="#34d399" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">137 tests · 0 failures</text><rect x="1070" y="710" width="320" height="112" rx="16" fill="#0f1b2d" stroke="#334155"/><text x="1092" y="744" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="800" text-anchor="start">RELEASE TARGET</text><text x="1092" y="785" fill="#fbbf24" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">static musl · no INTERP</text><text x="60" y="872" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Every generated asset is deterministic, privacy-checked, and bound to source/output SHA-256 digests.</text></g>
</svg>
