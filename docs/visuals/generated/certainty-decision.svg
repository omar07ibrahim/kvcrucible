<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title description">
  <title id="title">KVCrucible convergence verdict decision tree</title>
  <desc id="description">Exactness and frontier equality are eligibility preconditions. Only eligible cache views can converge or diverge; otherwise the result is ineligible.</desc>
  <g><rect x="0" y="0" width="1440" height="920" rx="0" fill="#07111f"/><text x="60" y="66" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">How KVCrucible reaches a verdict</text><text x="60" y="101" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Unknown evidence is not silently converted into a cache divergence</text><rect x="1216" y="48" width="164" height="34" rx="17" fill="#111f34" stroke="#fbbf24"/><text x="1298" y="71" fill="#fbbf24" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">FAIL CLOSED</text><rect x="430" y="145" width="580" height="82" rx="18" fill="#0f1b2d" stroke="#334155"/><text x="720" y="179" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">pristine summary + faulted summary</text><text x="720" y="205" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">same visible publisher stream</text><line x1="720" y1="227" x2="720" y2="265" stroke="#334155" stroke-width="3"/><polygon points="720,265 713,252 727,252" fill="#334155"/><rect x="420" y="265" width="600" height="94" rx="18" fill="#111f34" stroke="#5eead4"/><text x="720" y="305" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Are both summaries exact + authoritative?</text><text x="720" y="334" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">no active unknown reason or pending evidence</text><text x="1038" y="316" fill="#fbbf24" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start">NO</text><line x1="1020" y1="312" x2="1135" y2="312" stroke="#fbbf24" stroke-width="3"/><polygon points="1135,312 1122,305 1122,319" fill="#fbbf24"/><rect x="1135" y="270" width="255" height="92" rx="16" fill="#302611" stroke="#fbbf24"/><text x="1262" y="308" fill="#fbbf24" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Ineligible</text><text x="1262" y="336" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">inexact side flagged</text><text x="735" y="383" fill="#34d399" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start">YES</text><line x1="720" y1="359" x2="720" y2="415" stroke="#34d399" stroke-width="3"/><polygon points="720,415 713,402 727,402" fill="#34d399"/><rect x="420" y="415" width="600" height="82" rx="18" fill="#111f34" stroke="#a78bfa"/><text x="720" y="465" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Did both sides reach the same frontier?</text><text x="1038" y="456" fill="#fbbf24" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start">NO</text><line x1="1020" y1="456" x2="1135" y2="456" stroke="#fbbf24" stroke-width="3"/><polygon points="1135,456 1122,449 1122,463" fill="#fbbf24"/><rect x="1135" y="414" width="255" height="92" rx="16" fill="#302611" stroke="#fbbf24"/><text x="1262" y="452" fill="#fbbf24" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Ineligible</text><text x="1262" y="480" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">frontier mismatch</text><text x="735" y="521" fill="#34d399" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start">YES</text><line x1="720" y1="497" x2="720" y2="555" stroke="#34d399" stroke-width="3"/><polygon points="720,555 713,542 727,542" fill="#34d399"/><rect x="420" y="555" width="600" height="82" rx="18" fill="#111f34" stroke="#34d399"/><text x="720" y="605" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Are canonical scope + cache membership equal?</text><text x="512" y="665" fill="#34d399" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start">YES</text><text x="914" y="665" fill="#fb7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start">NO</text><line x1="620" y1="637" x2="360" y2="700" stroke="#34d399" stroke-width="3"/><polygon points="360,700 373,693 373,707" fill="#34d399"/><line x1="820" y1="637" x2="1080" y2="700" stroke="#fb7185" stroke-width="3"/><polygon points="1080,700 1067,693 1067,707" fill="#fb7185"/><rect x="190" y="700" width="340" height="94" rx="18" fill="#0b2a26" stroke="#34d399"/><text x="360" y="742" fill="#34d399" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle">Converged</text><text x="360" y="770" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">eligible and equal</text><rect x="910" y="700" width="340" height="94" rx="18" fill="#311523" stroke="#fb7185"/><text x="1080" y="742" fill="#fb7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle">Diverged</text><text x="1080" y="770" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">eligible but different</text><rect x="50" y="820" width="1340" height="70" rx="14" fill="#0f1b2d" stroke="#334155"/><text x="720" y="847" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Every active inexact/frontier flag is retained in the result</text><text x="720" y="874" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Hard fold/resource errors remain typed errors · they are never verdicts</text></g>
</svg>
