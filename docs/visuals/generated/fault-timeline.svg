<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title description">
  <title id="title">KVCrucible deterministic fault execution</title>
  <desc id="description">Pristine and faulted delivery timelines show the observed dispositions and equal exact final state.</desc>
  <g><rect x="0" y="0" width="1440" height="780" rx="0" fill="#07111f"/><text x="60" y="66" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">Deterministic fault execution</text><text x="60" y="101" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">The diagram is derived from the freshly executed fault_materialization example</text><rect x="1224" y="48" width="156" height="34" rx="17" fill="#111f34" stroke="#34d399"/><text x="1302" y="71" fill="#34d399" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">CONVERGED</text><text x="62" y="166" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">PRISTINE</text><text x="170" y="166" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">physical occurrence-zero order</text><rect x="50" y="188" width="1340" height="178" rx="18" fill="#0f1b2d" stroke="#334155"/><text x="84" y="222" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">3 deliveries</text><text x="84" y="343" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">Exact · frontier 2 · 3 keys</text><text x="62" y="420" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">FAULTED</text><text x="170" y="420" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">duplicate e1, then move e2 before e0</text><rect x="50" y="442" width="1340" height="224" rx="18" fill="#111f34" stroke="#334155"/><text x="84" y="476" fill="#a78bfa" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start">4 deliveries</text><text x="84" y="641" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">Exact · frontier 2 · 3 keys</text><rect x="50" y="700" width="1340" height="48" rx="14" fill="#0b2a26" stroke="#1f6f5f"/><text x="720" y="731" fill="#34d399" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">same eligible cache view  →  Converged</text><rect x="300" y="267" width="132" height="82" rx="12" fill="#111f34" stroke="#5eead4"/><text x="366" y="300" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">e0#0</text><text x="366" y="328" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Applied</text><line x1="432" y1="308" x2="642" y2="308" stroke="#334155" stroke-width="3"/><polygon points="642,308 629,301 629,315" fill="#334155"/><rect x="660" y="267" width="132" height="82" rx="12" fill="#111f34" stroke="#5eead4"/><text x="726" y="300" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">e1#0</text><text x="726" y="328" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Applied</text><line x1="792" y1="308" x2="1002" y2="308" stroke="#334155" stroke-width="3"/><polygon points="1002,308 989,301 989,315" fill="#334155"/><rect x="1020" y="267" width="132" height="82" rx="12" fill="#111f34" stroke="#5eead4"/><text x="1086" y="300" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">e2#0</text><text x="1086" y="328" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Applied</text><rect x="260" y="535" width="132" height="82" rx="12" fill="#111f34" stroke="#a78bfa"/><text x="326" y="568" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">e2#0</text><text x="326" y="596" fill="#a78bfa" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Buffered</text><line x1="392" y1="576" x2="542" y2="576" stroke="#334155" stroke-width="3"/><polygon points="542,576 529,569 529,583" fill="#334155"/><rect x="560" y="535" width="132" height="82" rx="12" fill="#111f34" stroke="#a78bfa"/><text x="626" y="568" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">e0#0</text><text x="626" y="596" fill="#a78bfa" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Applied</text><line x1="692" y1="576" x2="842" y2="576" stroke="#334155" stroke-width="3"/><polygon points="842,576 829,569 829,583" fill="#334155"/><rect x="860" y="535" width="132" height="82" rx="12" fill="#111f34" stroke="#a78bfa"/><text x="926" y="568" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">e1#0</text><text x="926" y="596" fill="#a78bfa" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Applied</text><line x1="992" y1="576" x2="1142" y2="576" stroke="#334155" stroke-width="3"/><polygon points="1142,576 1129,569 1129,583" fill="#334155"/><rect x="1160" y="535" width="132" height="82" rx="12" fill="#111f34" stroke="#a78bfa"/><text x="1226" y="568" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">e1#1</text><text x="1226" y="596" fill="#a78bfa" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Duplicate</text></g>
</svg>
