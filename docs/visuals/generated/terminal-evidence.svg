<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title description">
  <title id="title">KVCrucible verified terminal evidence</title>
  <desc id="description">Exact stdout from the fault materialization and delivered fold examples, followed by normalized local quality-gate outcomes.</desc>
  <g><rect x="0" y="0" width="1440" height="820" rx="0" fill="#07111f"/><text x="60" y="66" fill="#e6edf7" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start">KVCrucible · verified terminal evidence</text><text x="60" y="101" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">Exact example stdout · normalized gates · synthetic fixtures · CPU-only</text><rect x="1120" y="48" width="122" height="34" rx="17" fill="#111f34" stroke="#34d399"/><text x="1181" y="71" fill="#34d399" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">VERIFIED</text><rect x="1254" y="48" width="126" height="34" rx="17" fill="#111f34" stroke="#5eead4"/><text x="1317" y="71" fill="#5eead4" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">OFFLINE</text><rect x="48" y="132" width="1344" height="630" rx="18" fill="#0f1b2d" stroke="#334155"/><circle cx="80" cy="164" r="7" fill="#fb7185"/><circle cx="104" cy="164" r="7" fill="#fbbf24"/><circle cx="128" cy="164" r="7" fill="#34d399"/><text x="164" y="171" fill="#9fb0c7" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="14" font-weight="400" text-anchor="start">evidence capture</text><text x="78" y="207" fill="#5eead4" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">$ cargo run --quiet --example fault_materialization</text><text x="78" y="234" fill="#e6edf7" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">e2#0 Buffered</text><text x="78" y="261" fill="#e6edf7" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">e0#0 Applied</text><text x="78" y="288" fill="#e6edf7" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">e1#0 Applied</text><text x="78" y="315" fill="#e6edf7" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">e1#1 Duplicate</text><text x="78" y="342" fill="#e6edf7" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">certainty=Exact frontier=Some(2) keys=3</text><text x="78" y="369" fill="#e6edf7" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">verdict=Converged pristine_deliveries=3 faulted_deliveries=4</text><text x="78" y="396" fill="#e6edf7" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start"></text><text x="78" y="423" fill="#5eead4" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">$ cargo run --quiet --example delivered_fold</text><text x="78" y="450" fill="#e6edf7" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">Applied</text><text x="78" y="477" fill="#e6edf7" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">Buffered</text><text x="78" y="504" fill="#e6edf7" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">Applied</text><text x="78" y="531" fill="#e6edf7" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">certainty=Exact frontier=Some(2) keys=3</text><text x="78" y="558" fill="#e6edf7" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start"></text><text x="78" y="585" fill="#5eead4" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">$ cargo fmt --all --check</text><text x="78" y="612" fill="#34d399" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">PASS</text><text x="78" y="639" fill="#5eead4" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">$ cargo clippy --all-targets --all-features --locked -- -D warnings</text><text x="78" y="666" fill="#34d399" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">PASS</text><text x="78" y="693" fill="#5eead4" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">$ cargo test --all-targets --all-features --locked -- --test-threads=1</text><text x="78" y="720" fill="#34d399" font-family="DejaVu Sans Mono, ui-monospace, monospace" font-size="15" font-weight="400" text-anchor="start">PASS · 137 tests · 0 failed</text><text x="60" y="796" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start">Transcript and SHA-256 bindings: docs/visuals/generated/</text></g>
</svg>
