<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title description">
  <title id="title">KVCrucible implemented evidence architecture</title>
  <desc id="description">Bounded JSONL validation and normalization seal one executable trace, then fresh pristine and faulted folds feed an eligibility-aware convergence oracle. Planned layers are separate.</desc>
