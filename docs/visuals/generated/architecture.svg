dle">Converged</text><text x="360" y="1038" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">equal view</text><rect x="580" y="980" width="280" height="72" rx="16" fill="#311523" stroke="#fb7185"/><text x="720" y="1015" fill="#fb7185" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Diverged</text><text x="720" y="1038" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">different view</text><rect x="940" y="980" width="280" height="72" rx="16" fill="#302611" stroke="#fbbf24"/><text x="1080" y="1015" fill="#fbbf24" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="middle">Ineligible</text><text x="1080" y="1038" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle">insufficient evidence</text><line x1="50" y1="1090" x2="1390" y2="1090" stroke="#334155" stroke-width="2" stroke-dasharray="8 8"/><text x="60" y="1120" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="start">PLANNED · OUTSIDE THIS EVIDENCE</text><rect x="380" y="1102" width="180" height="34" rx="17" fill="#111f34" stroke="#9fb0c7"/><text x="470" y="1125" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">REPLAY EVENTS</text><rect x="580" y="1102" width="178" height="34" rx="17" fill="#111f34" stroke="#9fb0c7"/><text x="669" y="1125" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">1-MINIMAL WITNESS</text><rect x="778" y="1102" width="168" height="34" rx="17" fill="#111f34" stroke="#9fb0c7"/><text x="862" y="1125" fill="#9fb0c7" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">vLLM ADAPTER</text><rect x